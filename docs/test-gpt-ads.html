<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPT Ad Debug Test v2 - 原始代码对比</title>

  <!-- GPT Script -->
  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js" crossorigin="anonymous"></script>

  <style>
    body { font-family: monospace; padding: 20px; background: #f5f5f5; max-width: 800px; margin: 0 auto; }
    h2, h3 { color: #333; }
    .status { padding: 8px 12px; margin: 6px 0; border-radius: 4px; font-size: 13px; }
    .ok  { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
    .err { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
    .info{ background: #d1ecf1; color: #0c5460; border-left: 4px solid #17a2b8; }
    .warn{ background: #fff3cd; color: #856404; border-left: 4px solid #ffc107; }
    .ad-box { background: #fff; border: 2px dashed #aaa; margin: 16px 0; padding: 12px; text-align: center; }
    .ad-box h4 { margin: 0 0 8px; font-size: 12px; color: #888; }
    hr { margin: 30px 0; border: 1px solid #ddd; }
  </style>
</head>
<body>

<h2>GPT 广告调试 v2</h2>
<p>域名: <strong id="domain"></strong> &nbsp;|&nbsp; GAM响应: <span id="summary">等待中...</span></p>

<!-- ============================================================ -->
<hr>
<h3>方案A：完全照搬 Ynmedia 原始代码（Banner_1）</h3>
<p style="font-size:12px;color:#666">每个slot独立调用 enableSingleRequest + enableServices，与 广告代码.txt 一字未改</p>

<div class="ad-box">
  <h4>/22796784223/Ynmedia/novelvibe.top/Banner_1</h4>
  <script>
    window.googletag = window.googletag || {cmd: []};
    googletag.cmd.push(function() {
      googletag.defineSlot('/22796784223/Ynmedia/novelvibe.top/Banner_1', [[336, 280], [300, 250]], 'div-gpt-ad-1779247816993-0').addService(googletag.pubads());
      googletag.setConfig({singleRequest: true});
      googletag.enableServices();
    });
  </script>
  <div id='div-gpt-ad-1779247816993-0' style='min-width: 300px; min-height: 250px; display:inline-block;'>
    <script>
      googletag.cmd.push(function() { googletag.display('div-gpt-ad-1779247816993-0'); });
    </script>
  </div>
</div>

<!-- ============================================================ -->
<hr>
<h3>方案B：合并写法（Banner_2）</h3>
<p style="font-size:12px;color:#666">当前章节页使用的方式</p>

<div class="ad-box">
  <h4>/22796784223/Ynmedia/novelvibe.top/Banner_2</h4>
  <div id='div-gpt-ad-1779247849519-0' style='min-width: 300px; min-height: 250px; display:inline-block;'></div>
</div>

<script>
  window.googletag = window.googletag || {cmd: []};
  googletag.cmd.push(function() {
    googletag.defineSlot('/22796784223/Ynmedia/novelvibe.top/Banner_2', [[300, 250], [336, 280]], 'div-gpt-ad-1779247849519-0')
             .addService(googletag.pubads());
    googletag.display('div-gpt-ad-1779247849519-0');
  });
</script>

<!-- ============================================================ -->
<hr>
<h3>诊断日志</h3>
<div id="diag-log"></div>

<script>
(function() {
  document.getElementById('domain').textContent = window.location.hostname;
  var diag = document.getElementById('diag-log');
  var counts = { total: 0, filled: 0, empty: 0 };

  function addLog(msg, type) {
    var el = document.createElement('div');
    el.className = 'status ' + (type || 'info');
    el.textContent = new Date().toLocaleTimeString() + ' — ' + msg;
    diag.appendChild(el);
    console.log('[AdTest]', msg);
  }

  window.googletag = window.googletag || {cmd: []};

  googletag.cmd.push(function() {
    addLog('GPT 已就绪', 'ok');

    googletag.pubads().addEventListener('slotRenderEnded', function(e) {
      counts.total++;
      var id = e.slot.getSlotElementId();
      var path = e.slot.getAdUnitPath();
      if (e.isEmpty) {
        counts.empty++;
        addLog('❌ EMPTY: ' + path + ' — GAM返回无广告（isEmpty=true）', 'err');
      } else {
        counts.filled++;
        addLog('✅ 有广告: ' + path + '  尺寸:' + e.size + '  广告主ID:' + (e.advertiserId || 'N/A'), 'ok');
      }
      document.getElementById('summary').textContent =
        '共' + counts.total + '个 | ✅' + counts.filled + '有广告 | ❌' + counts.empty + '为空';
    });

    googletag.pubads().addEventListener('slotResponseReceived', function(e) {
      addLog('服务器已响应: ' + e.slot.getAdUnitPath(), 'info');
    });
  });

  setTimeout(function() {
    var iframes = document.querySelectorAll('iframe[id*="google_ads"]');
    addLog('⏱ 10秒检查: 页面内共 ' + iframes.length + ' 个广告iframe', iframes.length > 0 ? 'ok' : 'warn');
    if (counts.empty > 0 && counts.filled === 0) {
      addLog('结论：广告位路径和代码都正确，GAM服务器响应但不投放。原因：① Ynmedia尚未配置投放计划/Line Items，② 广告位审核中，③ 当前时段无买家库存。请联系Ynmedia确认广告位是否已激活。', 'warn');
    }
  }, 10000);
})();
</script>

</body>
</html>
